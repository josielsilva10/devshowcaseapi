services:
  - type: web
    name: devshowcase-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run prisma:generate:postgres && npm run build
    startCommand: npm run prisma:migrate:deploy:postgres && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString

databases:
  - name: devshowcase-db
    databaseName: devshowcase
    user: devshowcase
    plan: free
    region: ohio
    postgresMajorVersion: "17"
